name: render-film

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "preview | final | final4k"
        default: "preview"
      jobs:
        description: "number of render jobs (max 20 run at once; more run in batches of 20)"
        default: "20"
      frames:
        description: "frame list/range to render (empty = whole film)"
        default: ""
      samples:
        description: "override samples (empty = preset)"
        default: ""
      overlay:
        description: "burn physics numbers into the frames (preview)"
        type: boolean
        default: true
      encode:
        description: "collect + encode + commit (needs the whole film)"
        type: boolean
        default: true
      resume_run_id:
        description: "optional: earlier run id whose finished frames should be reused"
        default: ""

permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: "3.13.18"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      first: ${{ steps.plan.outputs.first }}
      last: ${{ steps.plan.outputs.last }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: System packages (fonts for livery lettering, ffmpeg)
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-wqy-zenhei fonts-freefont-ttf fonts-dejavu-core
      - name: Python packages (pinned)
        run: |
          python --version
          pip install -r requirements.txt
          python -c "import bpy; print('bpy', bpy.app.version_string, bpy.app.build_hash)"
      - name: Cache CC0 assets
        uses: actions/cache@v4
        with:
          path: assets
          key: polyhaven-${{ hashFiles('tools/fetch_assets.py') }}
      - name: Fetch CC0 assets (Poly Haven, MD5 verified)
        run: python tools/fetch_assets.py assets
      - name: Build scene once
        run: |
          ARGS=""
          if [ -n "${{ inputs.samples }}" ]; then ARGS="--samples ${{ inputs.samples }}"; fi
          python -m film.build --assets assets --out build/scene.blend --quality ${{ inputs.quality }} --texdir build/textures --pack $ARGS
          ls -la build
      - name: Physics log + sound
        run: |
          python -m film.physics build/physics.json
          python -m film.audio build/audio.wav
      - name: Plan matrix
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          n = int("${{ inputs.jobs }}")
          print("matrix=" + json.dumps(list(range(n))))
          print("first=1")
          import sys; sys.path.insert(0, "."); from film import shots as SH
          print(f"last={SH.timeline(SH.build_shots())[-1][2]}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scene
          path: |
            build/scene.blend
            build/physics.json
            build/audio.wav
          retention-days: 7
          compression-level: 0

  render:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        job: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: scene
          path: build
      - name: Resume - frames from earlier attempts of this run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: frames-${{ matrix.job }}-*
          path: frames
          merge-multiple: true
      - name: Resume - frames from an earlier run
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: frames-${{ matrix.job }}-*
          path: frames
          merge-multiple: true
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extra swap (memory headroom for the big v3 scene)
        run: |
          date +%s > /tmp/t0
          # on the big temporary disk (/mnt, ~70 GB): a 10 GB file on / (~14 GB free) left no room
          sudo fallocate -l 16G /mnt/swapextra && sudo chmod 600 /mnt/swapextra && sudo mkswap /mnt/swapextra && sudo swapon /mnt/swapextra || true
          free -g; df -h / /mnt; nproc
      # checkpoint part 1/4: render a quarter of this job's frames, then upload them at once, so a lost runner
      # (v3: runners died ~1 h in without logs) costs at most one part; re-runs resume from the uploaded parts
      - name: Render part 1/4
        if: ${{ !cancelled() }}
        run: |
          set +e
          FR="${{ inputs.frames }}"; ARGS=""
          if [ -n "$FR" ]; then ARGS="--frames $FR"; fi
          EL=$(( ($(date +%s) - $(cat /tmp/t0)) / 60 ))
          ( while true; do echo "[mon] $(date -u +%T) mem $(free -m | awk '/Mem:/{print $3"/"$2" MB"}') swap $(free -m | awk '/Swap:/{print $3"/"$2" MB"}') disk / $(df -h / | awk 'NR==2{print $4" free"}') /mnt $(df -h /mnt | awk 'NR==2{print $4" free"}')"; sleep 120; done ) &
          MON=$!
          # lower priority: the runner agent must always get CPU for its heartbeats
          nice -n 10 python tools/render_frames.py --blend build/scene.blend --out frames_p0 --done-dir frames \
            --job ${{ matrix.job }} --jobs ${{ strategy.job-total }} --part 0 --parts 4 \
            --deadline-min $((335 - EL)) --timing frames_p0/timing_${{ matrix.job }}_0.json --fresh --batch 1 $ARGS
          kill $MON 2>/dev/null
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frames-${{ matrix.job }}-a${{ github.run_attempt }}-p0
          path: frames_p0
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
      # checkpoint part 2/4: render a quarter of this job's frames, then upload them at once, so a lost runner
      # (v3: runners died ~1 h in without logs) costs at most one part; re-runs resume from the uploaded parts
      - name: Render part 2/4
        if: ${{ !cancelled() }}
        run: |
          set +e
          FR="${{ inputs.frames }}"; ARGS=""
          if [ -n "$FR" ]; then ARGS="--frames $FR"; fi
          EL=$(( ($(date +%s) - $(cat /tmp/t0)) / 60 ))
          ( while true; do echo "[mon] $(date -u +%T) mem $(free -m | awk '/Mem:/{print $3"/"$2" MB"}') swap $(free -m | awk '/Swap:/{print $3"/"$2" MB"}') disk / $(df -h / | awk 'NR==2{print $4" free"}') /mnt $(df -h /mnt | awk 'NR==2{print $4" free"}')"; sleep 120; done ) &
          MON=$!
          # lower priority: the runner agent must always get CPU for its heartbeats
          nice -n 10 python tools/render_frames.py --blend build/scene.blend --out frames_p1 --done-dir frames \
            --job ${{ matrix.job }} --jobs ${{ strategy.job-total }} --part 1 --parts 4 \
            --deadline-min $((335 - EL)) --timing frames_p1/timing_${{ matrix.job }}_1.json --fresh --batch 1 $ARGS
          kill $MON 2>/dev/null
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frames-${{ matrix.job }}-a${{ github.run_attempt }}-p1
          path: frames_p1
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
      # checkpoint part 3/4: render a quarter of this job's frames, then upload them at once, so a lost runner
      # (v3: runners died ~1 h in without logs) costs at most one part; re-runs resume from the uploaded parts
      - name: Render part 3/4
        if: ${{ !cancelled() }}
        run: |
          set +e
          FR="${{ inputs.frames }}"; ARGS=""
          if [ -n "$FR" ]; then ARGS="--frames $FR"; fi
          EL=$(( ($(date +%s) - $(cat /tmp/t0)) / 60 ))
          ( while true; do echo "[mon] $(date -u +%T) mem $(free -m | awk '/Mem:/{print $3"/"$2" MB"}') swap $(free -m | awk '/Swap:/{print $3"/"$2" MB"}') disk / $(df -h / | awk 'NR==2{print $4" free"}') /mnt $(df -h /mnt | awk 'NR==2{print $4" free"}')"; sleep 120; done ) &
          MON=$!
          # lower priority: the runner agent must always get CPU for its heartbeats
          nice -n 10 python tools/render_frames.py --blend build/scene.blend --out frames_p2 --done-dir frames \
            --job ${{ matrix.job }} --jobs ${{ strategy.job-total }} --part 2 --parts 4 \
            --deadline-min $((335 - EL)) --timing frames_p2/timing_${{ matrix.job }}_2.json --fresh --batch 1 $ARGS
          kill $MON 2>/dev/null
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frames-${{ matrix.job }}-a${{ github.run_attempt }}-p2
          path: frames_p2
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
      # checkpoint part 4/4: render a quarter of this job's frames, then upload them at once, so a lost runner
      # (v3: runners died ~1 h in without logs) costs at most one part; re-runs resume from the uploaded parts
      - name: Render part 4/4
        if: ${{ !cancelled() }}
        run: |
          set +e
          FR="${{ inputs.frames }}"; ARGS=""
          if [ -n "$FR" ]; then ARGS="--frames $FR"; fi
          EL=$(( ($(date +%s) - $(cat /tmp/t0)) / 60 ))
          ( while true; do echo "[mon] $(date -u +%T) mem $(free -m | awk '/Mem:/{print $3"/"$2" MB"}') swap $(free -m | awk '/Swap:/{print $3"/"$2" MB"}') disk / $(df -h / | awk 'NR==2{print $4" free"}') /mnt $(df -h /mnt | awk 'NR==2{print $4" free"}')"; sleep 120; done ) &
          MON=$!
          # lower priority: the runner agent must always get CPU for its heartbeats
          nice -n 10 python tools/render_frames.py --blend build/scene.blend --out frames_p3 --done-dir frames \
            --job ${{ matrix.job }} --jobs ${{ strategy.job-total }} --part 3 --parts 4 \
            --deadline-min $((335 - EL)) --timing frames_p3/timing_${{ matrix.job }}_3.json --fresh --batch 1 $ARGS
          kill $MON 2>/dev/null
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frames-${{ matrix.job }}-a${{ github.run_attempt }}-p3
          path: frames_p3
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
      - name: All frames of this job present? (fails the job if not, so 're-run failed jobs' resumes it)
        run: |
          python - <<'PY'
          import glob, json, os, sys
          sys.path.insert(0, "tools")
          from render_frames import png_complete
          have = set()
          for d in ["frames"] + sorted(glob.glob("frames_p*")):
              for f in glob.glob(os.path.join(d, "frame_*.png")):
                  if png_complete(f):
                      have.add(os.path.basename(f))
          for f in glob.glob("frames_p*/timing_*.json"):
              d = json.load(open(f)); s = d.get("seconds") or []
              if s:
                  print(f"part {f}: {len(s)} frames, mean {sum(s)/len(s):.0f} s/frame incl. scene load")
          print(f"{len(have)} complete frames on this runner")
          PY
          python tools/render_frames.py --blend build/scene.blend --out frames --job ${{ matrix.job }} --jobs ${{ strategy.job-total }} --list-only > /tmp/todo.txt 2>/dev/null || true
          python - <<'PY'
          import glob, os, sys
          sys.path.insert(0, "tools")
          from render_frames import png_complete
          line = [l for l in open("/tmp/todo.txt") if l.startswith("TODO")]
          todo = [int(x) for x in line[0][5:].split(",") if x.strip()] if line else []
          missing = [f for f in todo if not any(png_complete(os.path.join(d, f"frame_{f:05d}.png")) for d in glob.glob("frames_p*"))]
          print(f"missing frames for this job: {len(missing)} {missing[:20]}")
          sys.exit(1 if missing or not line else 0)
          PY

  encode:
    needs: [build, render]
    if: ${{ inputs.encode && inputs.frames == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install pillow==13.0.0
      - uses: actions/download-artifact@v4
        with:
          name: scene
          path: build
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: frames
          merge-multiple: true
      - name: Validate + encode (refuses on missing/incomplete frames)
        run: |
          mkdir -p out
          Q=${{ inputs.quality }}
          OV=""
          if [ "${{ inputs.overlay }}" = "true" ]; then OV="--overlay build/physics.json"; fi
          python tools/encode.py --frames frames --first ${{ needs.build.outputs.first }} --last ${{ needs.build.outputs.last }} --grain 2.5 \
            --audio build/audio.wav --out out/cr450_${Q}.mp4 --ig out/cr450_${Q}_instagram.mp4 $OV --report out/report_${Q}.json
          cat out/report_${Q}.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: film-${{ inputs.quality }}
          path: out
          retention-days: 30
      - name: Commit film to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          for f in out/*.mp4; do
            sz=$(stat -c %s "$f")
            if [ "$sz" -lt 99000000 ]; then cp "$f" output/; else echo "skip $f ($sz bytes > GitHub 100 MB limit)"; fi
          done
          cp out/report_*.json output/
          git add output
          git commit -m "Rendered film (${{ inputs.quality }}) from run ${{ github.run_id }}" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
